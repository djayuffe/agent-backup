[project]
name = "agent-backup"
version = "0.1.0rc1"
description = "Mirror and back up local coding-agent session state"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["backup", "mirror", "transcript", "claude-code", "codex", "jsonl"]

[project.scripts]
agent-backup = "agent_backup:main"
claude-backup = "claude_backup:main"
claude-full-backup = "claude_full_backup:main"
codex-backup = "codex_backup:main"
codex-full-backup = "codex_full_backup:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent_backup", "claude_backup", "claude_full_backup", "codex_backup", "codex_full_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
