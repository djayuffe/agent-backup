[project]
name = "agent-backup"
version = "0.1.0rc2"
description = "Back up coding-agent sessions — Claude Code, Codex, or any JSONL agent — to Markdown, ZIP archives and verifiable 1:1 snapshots"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ulf Bertilsson" }]
maintainers = [{ name = "Ulf Bertilsson" }]
keywords = ["backup", "archive", "mirror", "transcript", "session", "claude-code", "codex", "jsonl", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/djayuffe/agent-backup"
Repository = "https://github.com/djayuffe/agent-backup"
Issues = "https://github.com/djayuffe/agent-backup/issues"
Changelog = "https://github.com/djayuffe/agent-backup/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8", "build>=1", "twine>=5"]

[project.scripts]
agent-backup = "agent_backup:main"
claude-backup = "claude_backup:main"
claude-full-backup = "claude_full_backup:main"
codex-backup = "codex_backup:main"
codex-full-backup = "codex_full_backup:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent_backup", "claude_backup", "claude_full_backup", "codex_backup", "codex_full_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["agent_backup.py", "claude_backup.py", "claude_full_backup.py", "codex_backup.py", "codex_full_backup.py"]

[tool.coverage.run]
source = ["agent_backup"]
parallel = true
